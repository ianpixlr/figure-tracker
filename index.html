<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A monthly cap for figure collecting. Prices in ringgit, on this phone.">
  <meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Figure Cap">
  <title>Figure Cap</title>
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="app">
    <header class="top">
      <div class="top-bar">
        <a class="monogram" href="#home" aria-label="Figure Cap home">FC</a>
        <p id="sync-status" class="sync-status">Synced</p>
        <a class="icon-btn" href="#settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="2"></circle>
            <path d="M5.5 19.5c1.4-3 3.7-4.5 6.5-4.5s5.1 1.5 6.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
          </svg>
        </a>
      </div>
      <p id="today-line" class="today"></p>
    </header>
    <main id="main" tabindex="-1">
      <noscript>
        <p>Figure Cap needs JavaScript. Your figures stay on this device once it runs.</p>
      </noscript>
    </main>
  </div>
  <nav class="nav" aria-label="Primary">
    <a href="#home" data-route="home">Home</a>
    <a href="#log" data-route="log">Log</a>
    <a href="#wish" data-route="wish">Wishlist</a>
    <a href="#sell" data-route="sell">Sell</a>
    <a href="#settings" data-route="settings">Settings</a>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="dialog"></dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
